services:
  db:
    image: postgres:16-alpine
    container_name: nevalo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nevalo
      POSTGRES_PASSWORD: nevalo
      POSTGRES_DB: nevalo
    ports:
      - "5432:5432"
    volumes:
      - nevalo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nevalo -d nevalo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nevalo_pgdata:
