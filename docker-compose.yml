services:
  db:
    image: postgres:16-alpine
    container_name: nevalo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nevalo
      POSTGRES_PASSWORD: nevalo
      POSTGRES_DB: nevalo
    ports:
      - "5432:5432"
    volumes:
      - nevalo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nevalo -d nevalo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nevalo-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://nevalo:nevalo@db:5432/nevalo?schema=public&connection_limit=10&pool_timeout=20"
      AUTH_SECRET: "${AUTH_SECRET:-dev-secret-change-me-in-production}"
      NEXTAUTH_URL: "http://localhost:3000"
      NODE_ENV: "production"
    ports:
      - "3000:3000"
    volumes:
      - nevalo_next_cache:/app/.next/cache

volumes:
  nevalo_pgdata:
  nevalo_next_cache:
